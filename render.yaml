services:
  - type: web
    name: liberrated
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w client
    startCommand: npm start -w server
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Leave blank to use the built-in demo database, which resets when the service restarts.
      - key: MONGODB_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
